name: Windows Smart V11 Preview

on:
  push:
    branches:
      - feat/windows-smart-v11-preview
    paths:
      - '.github/workflows/windows-smart-preview.yml'
      - 'smart-core.lock.json'
      - 'setup.dart'
      - 'core/**'
      - 'tool/**'
      - 'windows/**'
      - 'services/**'
      - 'lib/**'
      - 'plugins/**'
      - 'pubspec.*'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smart-v11-preview
  cancel-in-progress: true

jobs:
  windows-x64-portable:
    name: Build unsigned Windows x64 Smart portable
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Fetch and verify bundled Lite fallback
        shell: pwsh
        run: |
          & ./tool/fetch_lite_model.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch Dart dependencies and generate sources
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate optional Windows network benchmark syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tool/windows_network_benchmark.ps1').Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw 'Windows network benchmark script has syntax errors'
          }

      - name: Test original Bettbox models, proxy UI and Smart extension
        shell: pwsh
        run: |
          flutter test test/models test/views/proxies test/plugins test/smart_group_contract_test.dart test/smart_model_catalog_test.dart test/smart_learning_policy_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned Smart V11 source
        shell: pwsh
        run: |
          dart run tool/smart_core.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/smart_core.dart --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Lite model inference against exact Smart source
        shell: pwsh
        run: |
          $env:MIHOMO_SMART_MODEL = (Resolve-Path 'assets/data/Model-Lite.bin').Path
          Push-Location '.smart-core/mihomo'
          try {
            go test -count=1 ./component/smart/lightgbm -run 'TestCurrentModelSmoke|TestCurrentModelPreparedFeatureParity'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Build Smart V11 core and Windows helper
        shell: pwsh
        run: |
          dart setup.dart windows --arch amd64 --compatible --out core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'libclash/windows/BettboxCore.exe')) { throw 'Missing Smart core' }
          if (-not (Test-Path 'libclash/windows/BettboxHelperService.exe')) { throw 'Missing helper service' }
          $coreHash = (Get-FileHash 'libclash/windows/BettboxCore.exe' -Algorithm SHA256).Hash.ToLower()
          "CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test Windows TUN and system-proxy core configuration contract
        shell: pwsh
        run: |
          Push-Location core
          try {
            # The Go runner receives a truncated -modfile path in this
            # invocation of go test on Windows. Use the exact pinned Smart
            # mod/sum as the standard temporary module files for this job.
            # This modifies only the ephemeral CI checkout, after native
            # Smart build has already completed.
            Copy-Item -LiteralPath smart.mod -Destination go.mod -Force
            Copy-Item -LiteralPath smart.sum -Destination go.sum -Force
            go test -tags=bettbox_smart_portable -count=1 -run 'Test(TunUpdateSchemaKeepsPerformanceAndCompatibilityFields|TUNListenerStableAcrossControlOnlySettings|TunSchemaRejectsUnsupportedType)' .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Build Flutter Windows release
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=CORE_SHA256=$env:CORE_SHA256 --dart-define=APP_ENV=pre --dart-define=APP_ASSET_SUFFIX=windows-amd64-compatible-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'build/windows/x64/runner/Release/Bettbox.exe')) { throw 'Missing Windows app executable' }
          # The real Windows output must carry the model, not merely the build workspace.
          $lite = 'build/windows/x64/runner/Release/data/flutter_assets/assets/data/Model-Lite.bin'
          if (-not (Test-Path $lite)) { throw 'Release missing offline Lite fallback' }
          $expected = '23633022a815fb34e510befe1c176ba50af3ced48f08b172454f4cd6b8327788'
          if ((Get-FileHash $lite -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Release Lite fallback digest mismatch'
          }

      - name: Package portable ZIP (no installer signing required)
        shell: pwsh
        run: |
          dart windows/packaging/exe/package_windows.dart --arch amd64 --compatible --portable --no-installer --env pre
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem -Path dist -Filter '*windows-amd64-compatible-portable.zip')
          if ($archive.Count -ne 1) { throw 'Expected one Windows portable ZIP' }
          Get-FileHash $archive[0].FullName -Algorithm SHA256 | Format-List

      - name: Upload Windows Smart preview
        uses: actions/upload-artifact@v4
        with:
          name: Bettbox-Smart-V11-Windows-x64-portable
          path: dist/*windows-amd64-compatible-portable.zip
          if-no-files-found: error
          retention-days: 14
